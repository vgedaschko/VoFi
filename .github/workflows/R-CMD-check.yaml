# Prüflauf (Integrator, Spec 00 Abschnitte 2.4, 15.7): roxygen2, testthat, R CMD check --no-manual.
name: R-CMD-check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
      _R_CHECK_FORCE_SUGGESTS_: false
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3.3"
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # roxygen2 auf die lokale Entwicklungsversion gepinnt (8.x schreibt NAMESPACE/Rd anders)
          extra-packages: any::devtools, roxygen2@7.3.1, any::testthat, any::withr
      - name: Paket prüfen
        run: tools/check.sh
