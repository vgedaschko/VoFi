notes: "Mischsatz S3 (30 kWp): (10 x 7,70 + 20 x 6,66)/30 = 7,0067 ct/kWh; Einspeisung 18.900 kWh -> 1.324,26 EUR/a (S3-T6). Der PV-Default-Ausdruck von Teil B (3.9.1) nutzt alle drei Teileinspeisungsklassen einschließlich partial_40_100kwp (N-16, X-24 d). Fortschreibung für spätere Inbetriebnahmen (z. B. S2 01/2029: 6,66 x 0,99^4 = 6,40 ct; S5 12/2027: 7,70 x 0,99^2 = 7,55 ct) ist eine Näherung (D, ± 0,01 ct): Prüfpunkt Rundungsregel des EEG (Rundung je Stufe auf zwei Nachkommastellen; Folgeanpassung auf Basis der ungerundeten Werte) und die amtlichen BNetzA-Werte (F-25). Unsicherheit Neuanlagen ab 2027: processes/funding_risks_2026 (use: feed_in_continuation)."
