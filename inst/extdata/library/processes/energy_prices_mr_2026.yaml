notes: "Schockkorrelationen in processes/shock_correlations_2026. Die p_norm-Werte gelten für start_year 2027; für ein anderes Startjahr s: p̄(2026) x (1 + ḡ)^(s - 2026) (I p_norm_start_year). Mit p_norm: base (keine Krisenabweichung) kehrt der Prozess zum Trend vom Startwert zurück (Referenzszenarien S1-S5, 5.0 Nr. 6). Spotalternative Heizöl 17,2 ct brutto (prices/energy_prices_2026)."
