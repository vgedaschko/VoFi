notes: "Ziele: availability_after_2030 -> funding.<id>.approved eines Instruments ohne Entscheidungsknoten (sonst übernimmt der automatische Schlüssel mit Rolle decision). Ohne diese Vorlage entsteht dasselbe Risiko automatisch: rule:approval_probability setzt bei Antrag ab 2031-01-01 approval_probability = budget_risk.approval_probability x funding.<id>.availability_after_2030 (0,7, R-86); mit der Vorlage entfällt der automatische Schlüssel und p = 0,7 gilt allein (I approval_key_and_availability); payout_delay -> funding.<id>.payout_delay_months; repayment_grant_cut -> funding.<id>.repayment_grant.cut_share (01b 4.2; über den Expander auf financing.f_<id>_loan). Prüfwerte: PERT(0; 0; 6) (α = 1, β = 5) Mittel 1,0, q90 2,214256; discrete(0; 0,5; 1) Mittel 0,03, q95 = 0 (Q(0,95) = 0), q96 = 0,5."
