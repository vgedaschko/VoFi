notes: "Keine Paare mit rent_growth, construction_price_index, maintenance_index (strukturell gekoppelt). Fehlende Schlüssel werden verworfen (1.7.1, R-96). MFH-Varianten tragen dieselben Korrelationen wie die EFH-Prozesse (sonst nicht positiv definit: ohne Spiegelung kleinster Eigenwert −0,389); power_mfh spiegelt power (ρ 0,95), lpg spiegelt oil (ρ 0,80). Prüfwerte: volle 12 × 12-Matrix (66 Paare) Eigenwerte 6,02276; 1,77122; 1,24778; 0,86560; 0,60781; 0,53472; 0,45012; 0,20000; 0,15000; 0,05; 0,05; 0,05 (positiv definit, keine Reparatur); Teilmatrix der zehn Prozesse ohne lpg und power_mfh: 5,06475; 1,47189; 0,87818; 0,80099; 0,59464; 0,52757; 0,44568; 0,11631; 0,05; 0,05; Teilmatrix der acht Kernprozesse inflation, mortgage_rate, energy_price_{gas, power, heatpump_power, oil, district_heating, pellets}: 3,77181; 1,13739; 0,81782; 0,78155; 0,55072; 0,48524; 0,35546; 0,10000 (positiv definit, keine Reparatur)."
