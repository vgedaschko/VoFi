instructions:
  title: "VoFi-Eingabevorlage (Vollständiger Finanzplan mit Monte-Carlo-Simulation)"
  intro: |-
    Diese Arbeitsmappe ist eine verlustfreie Darstellung eines vofi-Szenarios. Einlesen mit vofi_read_scenario("datei.xlsx"), schreiben mit vofi_write_scenario(szenario, "datei.xlsx").
    Zeile 1 jedes Datenblatts enthält die Maschinenschlüssel (ausgeblendet, über das Pluszeichen am linken Rand einblendbar); der Leser orientiert sich nur an ihnen. Zeile 2 enthält die deutschen Überschriften, ab Zeile 3 folgen die Daten.
    Leere Zellen bedeuten „nicht gesetzt“: Es gelten die Vorgaben aus Typ-Defaults, global.yaml, Profil und Ableitungsregeln (Spalte Herkunft der Vorgabe). Die Spalten Quelle und Kommentar werden nicht eingelesen.
    Fehlermeldungen nennen Blatt und Zelle; die Herkunft jedes eingelesenen Werts ist die Excel-Zelle.
  legend_title: "Farblegende"
  legend_input: "Gelb: Eingabezelle"
  legend_info: "Grau: Angabe der Vorlage (berechnet bzw. gesperrt, wird nicht eingelesen)"
  sheets_title: "Blätter"
  numbers_title: "Zahlen, Datumsangaben, Codes"
  numbers: |-
    Zahlen als Zahlen eingeben; Excel speichert sie gebietsschemaunabhängig. Raten und Anteile sind Dezimalzahlen (0,039 bzw. 3,9 % in einer Prozentzelle), niemals 3,9.
    Als Text eingegebene Zahlen werden wie in YAML gelesen: 3,5 mit Hinweis als 3.5, „3,5 %“ als 0.035; ein Tausenderpunkt (150.000) ist bei Eurobeträgen ein Fehler.
    Datumsangaben als Excel-Datum oder als Text JJJJ-MM-TT bzw. TT.MM.JJJJ; Termine dürfen auch ein Jahr sein (2028 = 1. Januar 2028).
    Auswahlfelder zeigen deutsche Bezeichnungen; Codes sind ebenfalls zulässig. Listen von Codes durch Komma trennen.
    Wahrheitswerte: WAHR/FALSCH oder ja/nein. Ein einzelnes ~ setzt einen Wert ausdrücklich auf leer (NULL). Text in doppelten Anführungszeichen bleibt immer Text.
    Strukturen (Maps, Listen, Wertformen in breiten Blättern) als YAML-Flussnotation, z. B. {ref: market.rent_growth, scale: 1.1} oder [od_repay, dep_invest].
  forms_title: "Wertformen (Spalten Wertform, Wert, Optionen)"
  rows_title: "Zeilen ergänzen"
  rows: |-
    Schlüssel-Wert-Blätter: eine neue Zeile mit dem vollständigen Pfad in der Spalte Pfad anlegen, z. B. energy.carriers.gas.price_eur_kwh oder shared.co2_2030. Platzhalter * durch die id ersetzen.
    Breite Blätter: eine Zeile je Element mit der id in Spalte A; nicht vorgesehene Felder als YAML-Map in der Spalte Weitere Angaben.
    Lange Blätter: eine Zeile je Parameter; die id wiederholen oder leer lassen (gilt die id der Zeile darüber).
    Varianten: Aktion setzen/ersetzen/hinzufügen mit Pfad und Wert, entfernen mit Pfad; Bezeichnung und basiert auf in der ersten Zeile der Variante.

