# Texte des Einlesens und der Normalisierung (WS-A, Spec 00 Abschnitte 4.4-4.11).
# Phase-0-Minimalfassung, Eigentümer: WS-A.
nan: "'{path}': der Wert '{value}' (NaN) ist keine zulässige Zahl."
decimal_comma: "'{path}': '{raw}' wurde als {value:raw} gelesen (Dezimalkomma)."
thousands_eur: "'{path}': '{raw}' ist bei Eurobeträgen mehrdeutig (Tausender- oder Dezimalpunkt). Bitte ohne Punkt angeben, z. B. {value}."
thousands: "'{path}': '{raw}' wurde als Dezimalzahl {value:raw} gelesen; ein Tausenderpunkt ist hier nicht vorgesehen."
percent: "'{path}': '{raw}' wurde als {value:raw} gelesen (Prozentangabe)."
number_read: "'{path}': '{raw}' wurde als Zahl {value:raw} gelesen."
not_number: "'{path}': '{raw}' ist keine Zahl."
not_utf8: "Die Datei '{path}' ist nicht UTF-8-kodiert (erste ungültige Zeile: {line}). Bitte als UTF-8 speichern."
yaml_warning: "Hinweis beim Lesen von '{path}': {detail}"
auto_not_allowed: "'{path}': '{value}' ist für diesen Parameter nicht zulässig (nur bei Kreditbeträgen)."
value_form_unknown: "'{path}': unbekannte Wertform mit den Schlüsseln {keys}."
rate_above_one: "'{path}': Raten und Anteile sind als Dezimalzahl anzugeben; {value:raw} ist als {suggestion:raw} oder \"{value:raw} %\" anzugeben."
series_year_invalid: "'{path}': series braucht eine Map Jahr -> Wert."
points_invalid: "'{path}': years und values müssen gleich lang und nicht leer sein."
growth_index_invalid: "'{path}': '{value}' ist kein zulässiger Index der Wachstumsform (calendar_year oder period_end)."
schedule_invalid: "'{path}': schedule braucht eine Map Datum bzw. Jahr -> Betrag."
not_integer: "'{path}': {value:raw} ist keine ganze Zahl."
not_logical: "'{path}': '{raw}' ist kein logischer Wert (ja/nein, true/false)."
timing_invalid: "'{path}': '{value}' ist kein Termin (Datum JJJJ-MM-TT, Jahr oder completion)."
not_string: "'{path}': '{raw}' ist keine Zeichenkette."
not_map: "'{path}' muss eine Map sein."
stochastic_root: "Die Stochastik-Datei '{path}' braucht den Wurzelschlüssel 'stochastic'."
scenario_not_map: "Ein Szenario muss eine benannte Liste (Map) der Blöcke sein."
example_unknown: "Unbekanntes Beispielszenario '{name}'.{suggestion}"
collection_invalid: "Die Sammlung '{block}' muss eine Map nach id oder eine Liste von Einträgen mit Feld id sein."
dist_base_missing: "'{path}': Kurzform-Verteilung '{dist}' ohne base; die Verteilung ist nicht registriert."
not_scenario: "'{arg}' muss ein Objekt der Klasse vofi_scenario sein."
variant_unknown: "Unbekannte Variante '{variant}'.{suggestion}"
variant_base_label: "Basis"
variant_cycle: "Zyklus in der extends-Kette der Varianten: {chain}."
variant_path_missing: "Variante '{variant}' ({op}): der Pfad '{path}' existiert nicht."
variant_path_exists: "Variante '{variant}' (add): der Pfad '{path}' existiert bereits."
scenario_set_unknown: "Unbekanntes Szenario-Set '{set}'.{suggestion}"
scenario_set_path: "Szenario-Set '{set}': der Pfad '{path}' ist nicht zulässig (nur market, funding, accounts, residual_value, stochastic, tax und project.pending_reforms)."
