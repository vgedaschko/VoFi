# Übergreifende Texte der Kennzahlen (WS-D2, Spec 00 Abschnitt 12). NA-Begründungen stehen
# ausschließlich unter vocab.na_reasons.* (2.10); Typlabels unter types.kpi.<name>.*.
not_kpi_value: "Kennzahl '{kpi}': compute() liefert kein Objekt der Klasse vofi_kpi_value."
length: "Kennzahl '{kpi}': erwartet {n:int} Werte (ein Wert je Lauf)."
shape: "Kennzahl '{kpi}': Form '{actual}' passt nicht zur Deklaration '{expected}'."
rv_independent: "unabhängig vom Restwert"
label_ex_rv: "{label} (ohne Restwert)"
notes:
