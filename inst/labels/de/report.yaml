  glossary:
    burden: "Monatliche Belastung"
    burden_def: "Zinsen, Tilgung, Energie, Wartung und sonstige laufende Kosten abzüglich Einspeiseerlösen, je Monat. Investitionen aus Eigenmitteln und Zuschüsse sind Einmalbeträge und nicht enthalten."
    saving: "Ersparnis bzw. Mehrkosten pro Monat"
    saving_def: "Monatliche Belastung der Referenz minus Belastung der Variante im selben Jahr; positiv bedeutet Ersparnis."
    own: "Eigenanteil nach Förderung"
    own_def: "Was Sie zu Beginn aus eigenen Mitteln zahlen, nachdem Zuschüsse abgezogen sind (Einmalbetrag)."
    calls: "Nachschüsse"
    calls_def: "Geld, das Sie später zusätzlich einzahlen müssen, weil Guthaben und Kredit eine Lücke nicht decken."
    payback: "Amortisationsjahr"
    payback_def: "Erstes Jahr, ab dem Sie dauerhaft mindestens so viel Vermögen haben wie ohne die Maßnahme bzw. wie in der Referenz. Zinsen, Förderung und Preissteigerungen sind berücksichtigt; das ist nicht dasselbe wie die einfache Amortisation in Handwerkerangeboten."
    wealth: "Endvermögen und Vermögensdifferenz"
    wealth_def: "Guthaben minus Schulden am Ende des Betrachtungszeitraums (mit oder ohne Restwert des Gebäudes bzw. der Maßnahmen) und der Unterschied zur Vergleichsrechnung."
    rv: "Restwert"
    rv_def: "Geschätzter Wert von Gebäude bzw. Maßnahmen am Ende des Betrachtungszeitraums. Er ist hypothetisch; deshalb steht das Ergebnis immer auch ohne Restwert."
    repay: "Tilgung"
    repay_def: "Rückzahlung des Kredits. Sie verringert die Schulden und ist deshalb Vermögensaufbau, auch wenn sie vom Konto abgeht."
    deposit: "Habenzins"
    deposit_def: "Zins, den Ihr Erspartes sonst gebracht hätte; mit ihm wird die Vergleichsrechnung ohne Maßnahme verzinst."
    simulation: "Simulierte Zukünfte"
    simulation_def: "Die Rechnung wird viele Male mit unterschiedlichen, plausiblen Entwicklungen von Zinsen, Energie- und CO2-Preisen und Kosten wiederholt. „In 8 von 10 simulierten Zukünften“ beschreibt die Bandbreite, keine Vorhersage."
    ratio: "Belastungsquote"
    ratio_def: "Monatliche Belastung geteilt durch das Haushaltsnettoeinkommen; über 40 % gilt die Belastung als hoch."
    cashflow: "Monatlicher Cashflow"
    cashflow_def: "Mieten und Umlage abzüglich laufender Kosten, Zinsen und Tilgung je Monat; ein negativer Wert ist ein Zuschuss aus eigenen Mitteln."
    warm_rent: "Warmmiete"
    warm_rent_def: "Nettokaltmiete plus Modernisierungsumlage plus Heiz- und Warmwasserkosten plus sonstige Betriebskosten der Mieter, je m² und Monat."

