    intro_landlord: "Monatlicher Cashflow nach Kapitaldienst: Mieten und Umlage abzüglich laufender Kosten, Zinsen und Tilgung. Positiv bedeutet Überschuss, negativ Zuschuss aus eigenen Mitteln."
