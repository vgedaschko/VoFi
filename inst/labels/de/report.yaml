    comparison: "Verglichen wird der Endwert am Horizont: jede Variante gegen ihre eigene Unterlassungsalternative mit denselben Einlagen und Entnahmen (Endwertdifferenz ΔEW), Varianten untereinander nach der Vergleichsregel ΔEW_A − ΔEW_B. Ungleiche Nachschüsse sind kein Vergleichbarkeitsfehler."
    interest: "Zinsen der Periode werden auf den Anfangsbestand berechnet (keine Zirkularität); gerechnet wird nominal in EUR brutto, die Kennzahlen stehen mit und ohne Restwert."
    mc: "Die Monte-Carlo-Simulation zieht unsichere Größen mit Latin Hypercube Sampling in Replikaten und benannten Zufallsströmen; alle Varianten laufen auf denselben Zukünften (gemeinsame Zufallszahlen), Differenzen werden je Lauf gebildet."
    limits_tax: "Ertragsteuern sind nicht berücksichtigt (Steuermodul none); Steuern können Ergebnis und Rangfolge der Varianten verändern."
    limits: "Grenzen: Der Restwert ist hypothetisch (kein erzwungener Verkauf, keine Vorfälligkeitsentschädigung); Mietrecht und Förderbedingungen sind vereinfacht abgebildet; die Verteilungen der Simulation sind überwiegend Expertenschätzungen."

  notes:
    disclaimer: "Dieser Bericht ist eine modellgestützte Wirtschaftlichkeitsrechnung. Er ist keine Steuer-, Rechts-, Förder- oder Finanzierungsberatung und ersetzt keine Prüfung im Einzelfall."
    funding: "Förderprogramme und Konditionen haben den Stand der Parameterbibliothek ({library}); sie können sich kurzfristig ändern. Förderanträge sind in der Regel vor Vorhabenbeginn zu stellen; eine Zusage ist nicht garantiert."
    legal: "Rechtsstand der Rechnung: {date}. Mietrecht (Modernisierungsumlage, Kappungsgrenzen), CO2-Kostenaufteilung und Förderbedingungen sind vereinfacht abgebildet; maßgeblich sind Gesetz, Förderrichtlinie und Vertrag."
    reforms: "Berücksichtigte anhängige Reformen bzw. Schalter: {reforms}."
    library_outdated: "Einzelne Bibliothekseinträge sind veraltet oder außerhalb ihrer Gültigkeit (siehe Annahmen)."
    library_unknown: "ohne Versionskennung"
    household_rounding: "Monatsbeträge sind auf 5 bzw. 10 € gerundet, Summen auf 100 €; die Beträge sind nominal (ohne Abzug der Inflation)."

