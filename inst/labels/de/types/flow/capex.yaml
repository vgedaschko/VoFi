# Labels des Zahlungstyps capex (WS-E, Spec 01 Teil A 4.6).
label: "Investitionskosten"
description: "Investitionskosten einer Maßnahme nach DIN 276 mit Zahlungsplan bzw. Mittelabflussprofil, Preisindex zum Zahlungstermin, Bauzeitverzug und Aktivierungsfaktor."
params:
  cost_eur:
    label: "Kosten gesamt"
    help: "Grundkosten in Preisen von price_base_year (brutto, sofern nicht cost_is_net), ohne Kostenfaktor."
  cost_kg:
    label: "Kosten je Kostengruppe"
    help: "Kosten je DIN-276-Kostengruppe kg200 bis kg700 (KG 100 ist Erwerb, KG 800 rechnet das Finanzierungsmodul)."
  kg700_share:
    label: "Baunebenkosten als Anteil"
    help: "Anteil der KG 700 an der Bezugsbasis (kg700_basis), zusätzlich zu einer angegebenen KG 700."
  contingency_share:
    label: "Risikozuschlag"
    help: "Zuschlag für Unvorhergesehenes auf die Bezugsbasis (contingency_basis); eigene Zeile."
  kg700_basis:
    label: "Bezugsbasis der Baunebenkosten"
    help: "kg300_400 (Bauwerk) oder kg200_600."
  contingency_basis:
    label: "Bezugsbasis des Risikozuschlags"
    help: "kg200_700 (Bau und Baunebenkosten) oder kg200_600 (nur Bau)."
  cost_factor:
    label: "Kostenfaktor"
    help: "Abweichungsfaktor auf die Kostenschätzung inklusive Risikozuschlag; Basisfall 1."
  cost_is_net:
    label: "Kosten netto angegeben"
    help: "Brutto = netto x (1 + Umsatzsteuersatz)."
  vat_rate:
    label: "Umsatzsteuersatz"
    help: "In den Bruttokosten enthaltener Satz (Basisfallwert; Ausweis netto und USt)."
  price_base_year:
    label: "Preisstand"
    help: "Jahr Y des Preisstands (1. Januar Y+1); Default project.price_base_year."
  price_index:
    label: "Preisindex p. a."
    help: "Baupreisindex bis zum Zahlungstermin; 0 = Festpreis."
  date:
    label: "Zahlungstermin"
    help: "Termin der Zahlung bzw. Ende der Ausführung (Jahr Y = 1. Januar Y)."
  payment_schedule:
    label: "Zahlungsplan"
    help: "Termine mit Anteilen (unit: share, Summe 1) oder Beträgen (unit: eur)."
  duration_months:
    label: "Ausführungsdauer in Monaten"
    help: "Monate vor dem Zahlungstermin, über die das Mittelabflussprofil verteilt wird."
  payment_profile:
    label: "Mittelabflussprofil"
    help: "linear, s_curve, front oder back."
  completion_date:
    label: "Fertigstellung"
    help: "Beginn der Wirkungen; Default letzter Zahlungstermin."
  delay_months:
    label: "Verzug der Maßnahme in Monaten"
    help: "Laufspezifische Verschiebung aller Zahlungen, der Fertigstellung und der Wirkungen (>= 0)."
  construction_delay_months:
    label: "Bauzeitverzug in Monaten"
    help: "Bauzeitverzug des Projekts; Wirkung auf die Zahlungen nach construction_delay_mode."
  construction_delay_mode:
    label: "Wirkung des Bauzeitverzugs"
    help: "none (keine), last (nur letzte Zahlung) oder stretch (anteilig gestreckt)."
  effect_start:
    label: "Beginn der Wirkungen"
    help: "completion (ab Fertigstellungsmonat) oder next_year (ab 1. Januar des Folgejahres)."
  active:
    label: "Aktivierungsfaktor"
    help: "0/1: Maßnahme findet statt (Basisfall 1)."
  classification:
    label: "Steuerliche Einordnung"
    help: "auto, erhaltung (sofort abziehbar) oder herstellung (AfA)."
  tax_category_kg200:
    label: "Steuerkategorie KG 200"
    help: "capex_depreciable (Hausanschlüsse), capex_land (Erschließungsbeiträge) oder capex_expensable."
  spread_years:
    label: "Verteilung des Erhaltungsaufwands"
    help: "Jahre nach § 82b EStDV (nur bei Erhaltung)."
  ohnehin_share:
    label: "Ohnehin-Anteil"
    help: "Wirtschaftlicher Ohnehin-Anteil der Kosten (nur Hilfsgrößen)."
  ohnehin_cost_eur:
    label: "Ohnehin-Kosten"
    help: "Ohnehin-Kosten in Preisen von price_base_year (nur Hilfsgrößen, höchstens die Gesamtkosten)."
rows:
  cost: "Kosten"
  cost_kg200: "Kosten KG 200 (Herrichten und Erschließen)"
  cost_kg300: "Kosten KG 300 (Bauwerk – Baukonstruktionen)"
  cost_kg400: "Kosten KG 400 (Bauwerk – Technische Anlagen)"
  cost_kg500: "Kosten KG 500 (Außenanlagen)"
  cost_kg600: "Kosten KG 600 (Ausstattung)"
  cost_kg700: "Kosten KG 700 (Baunebenkosten)"
  contingency: "Risikozuschlag"
msg:
  after_horizon: "Komponente '{id}': Zahlungsteile jenseits des Horizonts entfallen (Anteil der Läufe {share:pct})."
  no_timing: "Komponente '{id}': kein Zahlungstermin (date bzw. year oder payment_schedule angeben)."
  no_cost: "Komponente '{id}': keine Kostenangabe (cost_eur, cost_kg oder payment_schedule mit unit: eur)."
  not_schedule: "Komponente '{id}': Parameter '{param}' ist kein Zahlungsplan."
