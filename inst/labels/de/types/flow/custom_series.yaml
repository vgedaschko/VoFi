# Labels des Zahlungstyps custom_series (WS-E, Spec 00 Abschnitt 7.12, Spec 01 Teil A 4.13).
label: "Zahlungsreihe"
description: "Freie Zahlungsreihe je Periode (Periodenbeträge ohne Umrechnung auf die Periodenlänge), z. B. für Lehrbuch- und Orakelfälle."
params:
  values:
    label: "Beträge je Periode"
    help: "Wertform mit Pfad, z. B. [v0, v1, ..., vT]; Vorzeichen: Zufluss +, Abfluss -."
  section:
    label: "Abschnitt"
    help: "project, grants oder memo."
  category:
    label: "Kategorie"
    help: "Kategorie des Abschnitts (Default custom)."
  tax_category:
    label: "Steuerkategorie"
    help: "Default der Kategorie; principal ist nicht zulässig."
  cash:
    label: "Zahlungswirksam"
    help: "Default der Kategorie; Merkzeilen sind nie zahlungswirksam."
  kind:
    label: "Zeilenart"
    help: "flow, stock oder memo (Default der Kategorie)."
  unit:
    label: "Einheit"
    help: "Default der Kategorie (EUR)."
rows:
  value: "Zahlung"
msg:
  no_values: "Komponente '{id}': die Beträge values fehlen."
errors:
  section_invalid: "Komponente '{id}': Abschnitt '{value}' ist nicht zulässig (zulässig: {allowed})."
  category_invalid: "Komponente '{id}': Kategorie '{value}' gehört nicht zum Abschnitt '{section}' oder ist der Engine vorbehalten.{suggestion}"
  tax_category_invalid: "Komponente '{id}': Steuerkategorie '{value}' ist für die Kategorie '{category}' nicht zulässig (zulässig: {allowed})."
  memo_cash: "Komponente '{id}': Merkzeilen (Abschnitt memo) sind nie zahlungswirksam (cash: false)."
  sign: "Komponente '{id}': das Vorzeichen der Beträge widerspricht der Kategorie '{category}'."
  unit_invalid: "Komponente '{id}': unbekannte Einheit '{value}'."
