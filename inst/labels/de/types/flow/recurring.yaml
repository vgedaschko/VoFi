# Labels des Zahlungstyps recurring (WS-E, Spec 00 Abschnitt 7.12, Spec 01 Teil A 4.14).
label: "Laufender Jahresbetrag"
description: "Laufende Einnahme oder Ausgabe als Jahresbetrag, fortgeschrieben mit dem Kalenderjahresindex."
params:
  amount_eur:
    label: "Jahresbetrag"
    help: "Betrag je Jahr in EUR in Preisen von base_date (>= 0)."
  growth:
    label: "Wachstum p. a."
    help: "Konstante oder Pfad, z. B. {ref: market.inflation}."
  base_date:
    label: "Preisstand"
    help: "Default 1. Januar nach project.price_base_year."
  start_event:
    label: "Beginn"
    help: "Beginn des Zeitraums start_event bis to: Datum, Jahr oder completion (Default: Fertigstellung)."
  to:
    label: "Ende"
    help: "Default Horizontende."
  category:
    label: "Kategorie"
    help: "Kategorie der Abschnitte project oder grants (Default other_cost)."
  direction:
    label: "Richtung"
    help: "inflow oder outflow; Pflicht bei Kategorien ohne festes Vorzeichen."
  tax_category:
    label: "Steuerkategorie"
    help: "Default der Kategorie."
rows:
  value: "Jahresbetrag"
msg:
  direction_missing: "Komponente '{id}': die Kategorie '{category}' hat kein festes Vorzeichen; direction (inflow oder outflow) angeben."
  no_amount: "Komponente '{id}': der Jahresbetrag amount_eur fehlt."
errors:
  section_invalid: "Komponente '{id}': Abschnitt '{value}' ist nicht zulässig (zulässig: {allowed})."
  category_invalid: "Komponente '{id}': Kategorie '{value}' gehört nicht zu den Abschnitten {section} oder ist der Engine vorbehalten.{suggestion}"
  tax_category_invalid: "Komponente '{id}': Steuerkategorie '{value}' ist für die Kategorie '{category}' nicht zulässig (zulässig: {allowed})."
  memo_cash: "Komponente '{id}': Merkzeilen sind nie zahlungswirksam."
  sign: "Komponente '{id}': das Vorzeichen widerspricht der Kategorie '{category}'."
  amount_form: "Komponente '{id}': amount_eur muss ein fester Jahresbetrag sein (Wertform '{form}'); Wachstum ausschließlich über growth angeben."
  amount_negative: "Komponente '{id}': amount_eur muss >= 0 sein (das Vorzeichen folgt aus Kategorie bzw. direction)."
  direction_missing: "Komponente '{id}': die Kategorie '{category}' hat kein festes Vorzeichen; direction (inflow oder outflow) angeben."
  direction_conflict: "Komponente '{id}': direction '{direction}' widerspricht dem Vorzeichen der Kategorie '{category}'."
  start_after_to: "Komponente '{id}': der Beginn liegt nicht vor dem Ende (start_event < to)."
  category_assumed: "Komponente '{id}': keine Kategorie angegeben, other_cost angenommen (geht in den Reinertrag NOI ein)."
