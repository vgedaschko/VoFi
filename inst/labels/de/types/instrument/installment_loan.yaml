# Labels des Kredittyps installment_loan (WS-F, Spec 00 Abschnitte 8.1-8.6). Phase-0-Minimalfassung.
label: "Ratentilgungsdarlehen"
description: "Darlehen mit gleichbleibender Tilgungsrate; Zinsen auf den Restbestand."
