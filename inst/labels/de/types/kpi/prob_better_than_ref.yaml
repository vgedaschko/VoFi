# Labels der Vergleichskennzahl prob_better_than_ref (WS-G, Spec 00 Abschnitt 12.6).
label: "Wahrscheinlichkeit besser als Referenz"
description: "Je Lauf 1, wenn die Endwertdifferenz gegenüber der Referenz positiv ist, sonst 0; in der Simulation ist der Mittelwert die Wahrscheinlichkeit, besser als die Referenz zu sein. Nur im Vergleich (vofi_compare()) berechenbar."
