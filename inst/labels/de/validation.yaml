# Texte der Validierung (WS-B; Spec 00 Abschnitte 2.9, 2.10, 4.5, 13.5; Spec 01 Teil A 9,
# Teil B 0.3, 8, Teil C 1.11). Schlüssel: validation.<block>.<code> bzw. blockübergreifend
# validation.<code> (R-104, N-17); Sondernamensräume library, variants, scenario_set, profile,
# quantity, maintenance, acquisition, residual, expr, report, schema.
# Jede Meldung wird in den Tests mindestens einmal ausgelöst (Spec 00 15.6).

