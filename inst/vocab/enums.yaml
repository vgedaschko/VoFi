  aliases: {}
  default: ~
quality:
  codes: [A, B, C, D]
  aliases: {}
  default: ~
library_block:
  codes: [funding, financing, market, processes, components, legal, costs, valuation]
  aliases: {}
  default: ~
release_status:
  codes: [released, pending]
  aliases: {}
  default: ~
severity:
  codes: [error, warning, info]
  aliases: {}
  default: ~
# --- Ausgabe (13, 14) ---
table_layout:
  codes: [grob, transposed]
  aliases: {}
  default: grob
table_detail:
  codes: [standard, full]
  aliases: {}
  default: standard
report_format:
  codes: [html, docx]
  aliases: {}
  default: html
