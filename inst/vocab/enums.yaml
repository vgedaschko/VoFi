# Aufzaehlungen (Spec 00, Abschnitt 2.11). Form: name: {codes: [...], aliases: {alt: neu}, default: <code>}
# Aliase dienen nur der Eingabe-Normalisierung (R-07, R-09, R-34); intern erscheinen nur kanonische
# Codes. Labels: inst/labels/de/vocab.yaml unter vocab.enums.<name>.<code>.
# Zusatzfelder einzelner Enums sind maschinelle Regeln (z. B. Abbildungen, Teilmengen).
# Inhalt nach 2.11 (R-89): Enums aus Spec 00, Spec 01 Teil A 8.1 und Teil B 8 sowie die Enums der
# Feldtabellen von Spec 01 Teil A-C (Abschnitte "Spec 01" unten; Name = Feld- bzw. Enumname der
# Feldtabelle, P0-02).

# --- Projekt (4.3.2) ---
perspective:
  codes: [wu_kommunal, wu_genossenschaft, wu_privat, kleinvermieter, selbstnutzer]
  aliases: {}
  default: ~
tax_regime:
  codes: [wu_kommunal, wu_eg_befreit, wu_eg_stpfl, wu_kapges, wu_gemeinnuetzig, privat_vermieter, selbstnutzer]
  aliases: {}
  default: ~
  from_perspective:            # Default-Abbildung perspective -> tax_regime (R-08)
    wu_kommunal: wu_kommunal
    wu_genossenschaft: wu_eg_befreit
    wu_privat: wu_kapges
    kleinvermieter: privat_vermieter
    selbstnutzer: selbstnutzer
project_type:
  codes: [neubau, sanierung_eh, sanierung_einzelmassnahmen, sanierung_stufenweise, heizungstausch, erwerb_sanierung, erwerb_neubau]
  aliases: {}
  default: ~
  existing_building: [sanierung_eh, sanierung_einzelmassnahmen, sanierung_stufenweise, heizungstausch]   # Bestandsprojekte (1.5, 12.3a)
comparison_mode:
  codes: [absolute, differential]
  aliases: {}
  default: absolute
report_mode:
  codes: [auto, expert, household]
  aliases: {}
  default: auto
federal_state:
  codes: [BW, BY, BE, BB, HB, HH, HE, MV, NI, NW, RP, SL, SN, ST, SH, TH]
  aliases: {}
  default: ~
reform:
  codes: [mietrecht_ii, stufe_2045, unreleased]
  aliases: {}
  default: ~
