# Orakel (a), Lehrbuch-VoFi (Memo 01 §10.2, Spec 00 §15.3; WS-T).
# Annuitätendarlehen 40.000 zu 6 % (5 Jahre), endfälliges Darlehen 30.000 zu 5 %, EK 30.000,
# Habenzins 3 %, Sollzins 10 %, Restwert 40.000 in T = 5 als eigene Komponente.
# Sollwerte: a_rows.csv, a_kpis.csv (data-raw/export_oracles.py).
# Kernwerte: EW 38.504,63; EW_U 34.778,22; ΔEW 3.726,41; R1 = R2 = R3 = 5,1183 %.
schema_version: 1
meta: {scenario_id: oracle_a, title: "Orakel (a): Lehrbuch-VoFi"}
project: {perspective: wu_privat, project_type: neubau, valuation_date: 2027-01-01, horizon_years: 5}
components:
  z:  {type: custom_series, label: "Zahlungsfolge", values: [-100000, 6000, 10000, 30000, 8000, 30000]}
  rv: {type: custom_series, label: "Restwert", category: residual_value, values: [0, 0, 0, 0, 0, 40000]}
financing:
  ek:  {type: equity, amount_eur: 30000}
  ann: {type: annuity_loan, label: "Annuitätendarlehen", amount_eur: 40000, rate_pa: 0.06, term_years: 5, payments_per_year: 1}
  bul: {type: bullet_loan, label: "Endfälliges Darlehen", amount_eur: 30000, rate_pa: 0.05, term_years: 5, payments_per_year: 1}
accounts:
  deposit_rate_pa: 0.03
  overdraft_rate_pa: 0.10
  overdraft_limit_eur: .inf
  min_liquidity_eur: 0
  deposit_withholding_tax_share: 0
  surplus_order: [od_repay, dep_invest]
  deficit_order: [dep_withdraw, od_draw, equity_call]
residual_value: {method: zero}
tax: {module: none}
analysis:
  kpis: [terminal_value, terminal_value_opp, delta_terminal_value, roe_classic, roe_mirr, roe_irr,
         payback_time, payback_year, min_net_liquidity, max_overdraft, max_financing_need,
         sum_equity_calls, pv_equity_calls, flag_shortfall, flag_limit_breach, flag_reserve_used,
         withdrawal_equivalent, npv_cf_project, irr_cf_project]
