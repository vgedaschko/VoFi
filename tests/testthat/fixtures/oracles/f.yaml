# Orakel (f): Monatsannuität 100.000 zu 3,6 % nominal, 240 Monate, auf dem Jahresraster
# aggregiert (Memo 01 §10.7, Spec 00 §8.10, §15.3; WS-T), eingebettet in einen vollständigen
# VoFi (Zahlungsfolge −120.000 und 8.000 je Jahr, EK 20.000, h = 2 %, s = 8 %).
# Prüfwerte des Instruments: Rate 585,11; Zinsen Jahr 1: 3.542,98; Tilgung Jahr 1: 3.478,36;
# Restschuld Ende Jahr 1: 96.521,64.
schema_version: 1
meta: {scenario_id: oracle_f, title: "Orakel (f): Monatsannuität auf Jahresraster"}
project: {perspective: wu_privat, project_type: neubau, valuation_date: 2027-01-01, horizon_years: 20}
components:
