# Orakel (g): Vergleichsregel mit ungleichen Nachschüssen (Konzept F17, Spec 00 §9.6 Nr. 4,
# §15.3, R-66; Handrechnung WS-T). T = 2, Jahresraster, h = 2 %, s = 8 %, Strafzinsaufschlag
# 2 %, Kontokorrentlimit 0, Engpass-Policy equity_call, EK 10.000 in t = 0 in beiden Varianten.
# Referenz base: Zahlungsfolge −10.000 / +1.000 / +12.000; Variante a: −10.000 / −3.000 / +16.000.
# Sollwerte: a: Nachschuss t = 1: 3.000; EW_A 16.000,00; EW_U,A 13.464,00; ΔEW_A 2.536,00.
# base: keine Nachschüsse; EW_B 13.020,00; EW_U,B 10.404,00; ΔEW_B 2.616,00.
# delta_vs_reference(a) = −80,00 = (EW_A − EW_B = 2.980,00) − 3.000 · 1,02;
# sum_equity_calls a 3.000; pv_equity_calls a 2.941,18.
# Rechnung: vofi_compare(oracle_scenario("g"), variants = "a", baseline = "base").
schema_version: 1
meta: {scenario_id: oracle_g, title: "Orakel (g): Vergleichsregel mit ungleichen Nachschüssen"}
project: {perspective: wu_privat, project_type: neubau, valuation_date: 2027-01-01, horizon_years: 2, reference_variant: base}
components:
  z: {type: custom_series, label: "Zahlungsfolge", values: [-10000, 1000, 12000]}
financing:
  ek: {type: equity, amount_eur: 10000}
accounts:
  deposit_rate_pa: 0.02
  overdraft_rate_pa: 0.08
  overdraft_limit_eur: 0
  penalty_spread_pa: 0.02
  min_liquidity_eur: 0
  deposit_withholding_tax_share: 0
  surplus_order: [od_repay, dep_invest]
  deficit_order: [dep_withdraw, od_draw, equity_call]
residual_value: {method: zero}
tax: {module: none}
analysis:
  kpis: [terminal_value, terminal_value_opp, delta_terminal_value, roe_classic, roe_mirr, roe_irr,
         payback_time, payback_year, min_net_liquidity, max_overdraft, max_financing_need,
         sum_equity_calls, pv_equity_calls, flag_shortfall, flag_limit_breach, flag_reserve_used,
         withdrawal_equivalent, npv_cf_project, irr_cf_project]
variants:
