  life_nonpositive: "Komponente '{id}': die Nutzungsdauer muss > 0 sein."
  life_short: "Komponente '{id}': Nutzungsdauer {value} Jahre unter 5 Jahren."
  first_before_install: "Komponente '{id}': erster Ersatztermin {date} liegt vor dem Einbau."
  no_capex: "Komponente '{id}': include_initial = TRUE verlangt capex_id."
  many_events: "Komponente '{id}': {value:int} Ersatztermine im Horizont (mehr als 10)."
