# Test-Stubs der Validierungsmeldungen von WS-E-INV (Spec 00 2.10, R-104, R-117).
# Schlüssel relativ zu "validation." (Datei inst/labels/de/validation.yaml, Eigentümer WS-B).
# helper-ws-e-inv.R registriert nur Schlüssel, die der Katalog noch nicht enthält; die Texte sind
# der Vorschlag für validation.yaml. Platzhalter: {id} (Komponente) und {path} (Fundstelle) immer.
measures:
