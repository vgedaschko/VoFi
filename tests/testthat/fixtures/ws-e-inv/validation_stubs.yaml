  schedule_sum: "Komponente '{id}': die Anteile des Zahlungsplans ergeben {value:raw} statt 1."
  before_valuation: "Komponente '{id}': der Termin {date} liegt vor dem Bewertungsstichtag (Bestandskosten gehören nicht in die Investition)."
